                            onMouseLeave={e => { e.currentTarget.style.background='linear-gradient(135deg,rgba(46,196,182,0.08),rgba(116,199,236,0.08))'; e.currentTarget.style.borderColor='var(--border-color)'; e.currentTarget.style.boxShadow='none'; }}
                        >
                            <i className="fas fa-qrcode" style={{ fontSize: '1.1em' }} />
                            Scan QR Code to Sign In
                            <span style={{ marginLeft: 'auto', fontSize: '0.68em', background: 'rgba(46,196,182,0.12)', border: '1px solid rgba(46,196,182,0.25)', padding: '2px 7px', borderRadius: '20px', color: 'var(--aqua-primary)', fontFamily: 'IBM Plex Mono, monospace', letterSpacing: '0.04em' }}>Instant</span>
                        </button>

                        {/* Attempt indicator dots */}
                        {failedAttempts > 0 && !isLocked && (
                            <div style={{ display: 'flex', justifyContent: 'center', gap: '6px', marginTop: '10px' }}>
                                {Array.from({ length: MAX_ATTEMPTS }).map((_, i) => (
                                    <div key={i} style={{ width: '8px', height: '8px', borderRadius: '50%', background: i < failedAttempts ? '#f87171' : 'var(--border-color)', transition: 'background 0.3s' }}></div>
                                ))}
                            </div>
                        )}
                    </form>

                    {/* QR Login Modal — rendered inside the card's stacking context so it overlays everything */}
                    {showQRModal && (
                        <QRLoginModal
                            onApproved={(payload) => {
                                setShowQRModal(false);
                                onNext('QR_AUTH_' + Date.now());
                            }}
                            onClose={() => setShowQRModal(false)}
                        />
                    )}
                </div>
            );
        };

        // 2. NUMBER-MATCHING AUTHENTICATION STAGE (CROSS-DEVICE SOCKET.IO WITH OFFLINE SIMULATION FALLBACK)
        const OTPScreen = ({ studentId, onNext, onPrev }) => {
            const [targetNumber, setTargetNumber] = useState(0);
            const [options, setOptions] = useState([]);
            const [sessionId, setSessionId] = useState('');
            const [approveUrl, setApproveUrl] = useState('');
            const [error, setError] = useState('');
            const [timer, setTimer] = useState(30);
            const [attempts, setAttempts] = useState(0);
            const [socketConnected, setSocketConnected] = useState(false);
            const [isOfflineMode, setIsOfflineMode] = useState(false);
            const [qrUrl, setQrUrl] = useState('');

            // Fallback endpoints for cross-origin access and double-clicked file:// systems
            const SERVER_URL = (window.location.protocol === 'file:' || window.location.port !== '3000') ? 'http://localhost:3000' : '';
            const appOrigin = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;

            const socketRef = React.useRef(null);
            const qrRef = React.useRef(null);

            // Render QR code using qrcode.js whenever qrUrl changes
            React.useEffect(() => {
                if (!qrUrl || !qrRef.current) return;
                qrRef.current.innerHTML = '';
                try {
                    new window.QRCode(qrRef.current, {
                        text: qrUrl,
                        width: 148,
                        height: 148,
                        colorDark: '#1a9b8e',
                        colorLight: '#ffffff',
                        correctLevel: window.QRCode ? window.QRCode.CorrectLevel.M : 1,
                    });
                } catch(e) {
                    qrRef.current.innerHTML = '<p style="color:#e05c7a;font-size:0.75em">QR library not loaded. Ensure internet connection.</p>';
                }
            }, [qrUrl]);

            // Generate numbers locally (for Offline Mode fallback)
            const generateNumbersLocally = () => {
                const target = Math.floor(Math.random() * 90) + 10;
                let decoy1 = Math.floor(Math.random() * 90) + 10;
                while (decoy1 === target) { decoy1 = Math.floor(Math.random() * 90) + 10; }
                let decoy2 = Math.floor(Math.random() * 90) + 10;
                while (decoy2 === target || decoy2 === decoy1) { decoy2 = Math.floor(Math.random() * 90) + 10; }
                const rawOptions = [target, decoy1, decoy2];
                const shuffled = rawOptions.sort(() => Math.random() - 0.5);
                setTargetNumber(target);
                setOptions(shuffled);
                setTimer(30);
            };

            const initMfa = async () => {
                // Clean up any existing socket before reconnecting
                if (socketRef.current) {
                    socketRef.current.disconnect();
                    socketRef.current = null;
                }

                try {
                    const res = await fetch(`${SERVER_URL}/api/mfa/init`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ studentId })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setSessionId(data.sessionId);
                        setTargetNumber(data.targetNumber);
                        setApproveUrl(data.approveUrl);
                        setQrUrl(data.approveUrl); // Set QR URL for live mode
                        setIsOfflineMode(false);
                        
                        // Initialize Socket Connection
                        const socket = io(SERVER_URL || undefined);
                        socketRef.current = socket;
                        
                        socket.on('connect', () => {
                            setSocketConnected(true);
                            socket.emit('register-desktop', data.sessionId);
                        });

                        socket.on('approved', () => {
                            onNext(); // Move to workspace selection screen!
                        });

                        socket.on('denied', (payload) => {
                            setAttempts(payload.attempts);
                            setTargetNumber(payload.targetNumber);
                            setQrUrl(payload.approveUrl || `${appOrigin}/approve/${data.sessionId}`);
                            setError("Numbers don't match — approval denied. Retrying...");
                            setTimer(30);
                        });

                        socket.on('disconnect', () => {
                            setSocketConnected(false);
                        });
                    } else {
                        throw new Error('Init failed');
                    }
                } catch (err) {
                    // FALLBACK TO OFFLINE CLIENT-SIDE SIMULATION
                    setIsOfflineMode(true);
                    const sid = 'offline_sim_' + Math.random().toString(36).substr(2,6);
                    setSessionId(sid);
                    const localUrl = `${appOrigin}/approve/${sid}`;
                    setQrUrl(localUrl); // Generate QR even in offline mode
                    generateNumbersLocally();
                }
            };

            // Connect and initialize MFA request
            React.useEffect(() => {
                initMfa();
                return () => {
                    if (socketRef.current) {
                        socketRef.current.disconnect();
                    }
                };
            }, [studentId]);

            // Expiry countdown timer
            React.useEffect(() => {
                let interval = null;
                if (timer > 0 && sessionId) {
                    interval = setInterval(() => {
                        setTimer((prev) => prev - 1);
                    }, 1000);
                } else if (timer === 0 && sessionId) {
                    if (isOfflineMode) {
                        setError('Verification request expired. New numbers generated.');
                        generateNumbersLocally();
                    } else {
                        // Call backend to regenerate a new security key
                        const regenerate = async () => {
                            try {
                                const res = await fetch(`${SERVER_URL}/api/mfa/regenerate/${sessionId}`, { method: 'POST' });
                                const data = await res.json();
                                if (data.success) {
                                    setTargetNumber(data.targetNumber);
                                    setError('Verification request expired. New code generated.');
                                    setTimer(30);
                                }
                            } catch (err) {
                                generateNumbersLocally();
                            }
                        };
                        regenerate();
                    }
                }
                return () => clearInterval(interval);
            }, [timer, sessionId, isOfflineMode]);

            // Handle local click (for Offline Mode fallback)
            const handleLocalOptionClick = (selectedNum) => {
                if (selectedNum === targetNumber) {
                    setError('');
                    onNext();
                } else {
                    setAttempts(prev => prev + 1);
                    setError("Numbers don't match — approval denied. Retrying...");
                    generateNumbersLocally();
                }
            };

            return (
                <div className="portal-card" style={{ maxWidth: '820px', width: '95%', overflow: 'hidden' }}>
                    <div className="laminate-overlay"></div>
                    <div className="badge-slot"></div>

                    {/* Header */}
                    <div className="card-header" style={{ marginBottom: '20px', position: 'relative', zIndex: 20 }}>
                        <div className="badge-crest"><i className="fas fa-shield-alt"></i></div>
                        <h2 className="card-title" style={{ fontSize: '1.35em', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                            Verify Sign-in Request
                        </h2>
                        <div className="badge-title-sub">Step 2 · Phone Number Matching</div>
                    </div>

                    {/* How it works banner */}
                    <div style={{ position: 'relative', zIndex: 20, marginBottom: '18px', padding: '10px 16px', background: 'linear-gradient(135deg, rgba(46,196,182,0.07), rgba(116,199,236,0.07))', border: '1px solid var(--border-color)', borderRadius: '10px', fontSize: '0.78em', color: 'var(--text-secondary)', display: 'flex', alignItems: 'center', gap: '10px' }}>
                        <i className="fas fa-circle-info" style={{ color: 'var(--aqua-primary)', fontSize: '1.1em', flexShrink: 0 }}></i>
                        <span>
                            A number is shown on your <strong>computer screen below</strong>. Scan the QR code with your phone — you'll see <strong>3 numbers</strong>. Tap the one that <strong>matches</strong> the number on your computer to approve sign-in.
                        </span>
                    </div>

                    {/* Error message */}
                    {error && (
                        <div style={{ marginBottom: '16px', padding: '10px 14px', background: error.includes('expired') ? 'rgba(251,191,36,0.07)' : 'rgba(224,92,122,0.07)', border: `1px solid ${error.includes('expired') ? 'rgba(251,191,36,0.25)' : 'rgba(224,92,122,0.25)'}`, borderRadius: '8px', fontSize: '0.8em', color: error.includes('expired') ? '#ca8a04' : '#e05c7a', display: 'flex', alignItems: 'center', gap: '8px', position: 'relative', zIndex: 20 }}>
                            <i className={error.includes('expired') ? 'fas fa-hourglass-half' : 'fas fa-exclamation-triangle'}></i> {error}
                        </div>
                    )}

                    {/* Main Split Layout */}
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', position: 'relative', zIndex: 20, marginBottom: '20px' }}>

                        {/* LEFT — PC Number Display */}
                        <div style={{ background: 'linear-gradient(135deg, rgba(46,196,182,0.06), rgba(116,199,236,0.06))', border: '1.5px solid var(--border-color)', borderRadius: '14px', padding: '28px 20px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', minHeight: '260px' }}>
                            <div style={{ fontSize: '0.7em', color: 'var(--aqua-primary)', textTransform: 'uppercase', letterSpacing: '0.15em', marginBottom: '10px', fontFamily: 'IBM Plex Mono, monospace', display: 'flex', alignItems: 'center', gap: '6px' }}>
                                <i className="fas fa-desktop"></i> This number appears on your computer
                            </div>
                            <div style={{ fontSize: '4.5em', fontWeight: 800, fontFamily: 'Space Grotesk, sans-serif', color: 'var(--aqua-dark)', textShadow: '0 0 30px rgba(46,196,182,0.3)', lineHeight: 1, margin: '12px 0', background: 'linear-gradient(135deg, rgba(46,196,182,0.12), rgba(116,199,236,0.12))', padding: '14px 32px', borderRadius: '14px', border: '2px solid var(--border-color)' }}>
                                {targetNumber || '--'}
                            </div>
                            <div style={{ fontSize: '0.75em', color: 'var(--text-muted)', marginTop: '10px', display: 'flex', alignItems: 'center', gap: '6px', fontFamily: 'IBM Plex Mono, monospace' }}>
                                <i className="fas fa-clock"></i> Expires in&nbsp;
                                <span style={{ color: timer <= 10 ? '#e05c7a' : 'var(--aqua-primary)', fontWeight: 700, transition: 'color 0.3s' }}>{timer}s</span>
                            </div>
                            {/* Timer bar */}
                            <div style={{ width: '100%', height: '3px', background: 'rgba(46,196,182,0.12)', borderRadius: '3px', marginTop: '10px', overflow: 'hidden' }}>
                                <div style={{ height: '100%', width: `${(timer / 30) * 100}%`, background: timer <= 10 ? '#e05c7a' : 'var(--aqua-primary)', borderRadius: '3px', transition: 'width 1s linear, background 0.3s' }}></div>
                            </div>
                        </div>

                        {/* RIGHT — QR Code (always shown) + phone simulator in offline mode */}
                        <div style={{ background: 'linear-gradient(135deg, rgba(247,168,196,0.06), rgba(253,209,228,0.06))', border: '1.5px solid var(--border-pink)', borderRadius: '14px', padding: '20px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', minHeight: '260px', gap: '10px' }}>

                            {/* QR label */}
                            <div style={{ fontSize: '0.7em', color: 'var(--pink-dark)', textTransform: 'uppercase', letterSpacing: '0.12em', fontFamily: 'IBM Plex Mono, monospace', display: 'flex', alignItems: 'center', gap: '6px' }}>
                                <i className="fas fa-qrcode"></i>
                                {isOfflineMode ? 'Scan QR (local demo)' : 'Scan QR with your phone'}
                            </div>

                            {/* QR Code container — generated by qrcode.js into this div */}
                            <div style={{ background: 'white', padding: '8px', borderRadius: '12px', border: '2px solid var(--border-color)', boxShadow: '0 4px 16px rgba(46,196,182,0.15)', display: 'flex', alignItems: 'center', justifyContent: 'center', minWidth: '164px', minHeight: '164px' }}>
                                {qrUrl ? (
                                    <div ref={qrRef} id="mfa-qr-canvas" style={{ lineHeight: 0 }}></div>
                                ) : (
                                    <div style={{ color: 'var(--text-muted)', fontSize: '0.8em', fontFamily: 'IBM Plex Mono', padding: '20px' }}>
                                        <i className="fas fa-spinner fa-spin"></i><br/>Generating...
                                    </div>
                                )}
                            </div>

                            {/* Instruction */}
                            <div style={{ fontSize: '0.72em', color: 'var(--text-secondary)', lineHeight: 1.5 }}>
                                {isOfflineMode ? (
                                    <><i className="fas fa-info-circle" style={{ color: 'var(--aqua-primary)' }}></i> Server offline. Use buttons below to test.<br/><span style={{ color: 'var(--text-muted)' }}>Tap the number matching your computer.</span></>
                                ) : (
                                    <>Scan with your phone — tap the number<br/>that <strong>matches</strong> the one on your computer.</>  
                                )}
                            </div>

                            {/* Offline phone simulator buttons */}
                            {isOfflineMode && options.length > 0 && (
                                <div style={{ width: '100%', maxWidth: '220px' }}>
                                    <div style={{ fontSize: '0.65em', color: 'var(--aqua-dark)', fontFamily: 'IBM Plex Mono', marginBottom: '6px', fontWeight: 600 }}>
                                        <i className="fas fa-mobile-alt"></i> Simulated phone — tap matching number:
                                    </div>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '6px' }}>
                                        {options.map((opt, i) => (
                                            <button
                                                key={i}
                                                onClick={() => handleLocalOptionClick(opt)}
                                                style={{ background: 'linear-gradient(135deg, rgba(46,196,182,0.1), rgba(116,199,236,0.1))', border: '1.5px solid var(--border-color)', borderRadius: '10px', padding: '10px 0', fontSize: '1.25em', fontWeight: 700, cursor: 'pointer', color: 'var(--text-main)', fontFamily: 'Space Grotesk', transition: 'all 0.2s' }}
                                                onMouseOver={e => { e.currentTarget.style.background = 'linear-gradient(135deg,rgba(46,196,182,0.25),rgba(116,199,236,0.25))'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
                                                onMouseOut={e => { e.currentTarget.style.background = 'linear-gradient(135deg,rgba(46,196,182,0.1),rgba(116,199,236,0.1))'; e.currentTarget.style.transform = 'none'; }}
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                    <div style={{ fontSize: '0.65em', color: 'var(--text-muted)', fontFamily: 'IBM Plex Mono', marginTop: '6px' }}>
                                        Wrong taps: <span style={{ color: '#e05c7a', fontWeight: 600 }}>{attempts}</span>
                                    </div>
                                </div>
                            )}

                            {/* Live mode — open phone link & status */}
                            {!isOfflineMode && (
                                <>
                                    <button
                                        type="button"
                                        onClick={() => window.open(qrUrl || `${appOrigin}/approve/${sessionId}`, '_blank')}
                                        style={{ background: 'linear-gradient(135deg, var(--aqua-primary), var(--blue-primary))', color: 'white', border: 'none', borderRadius: '8px', padding: '8px 16px', fontSize: '0.73em', cursor: 'pointer', fontFamily: 'Space Grotesk', fontWeight: 600, display: 'flex', alignItems: 'center', gap: '6px', boxShadow: '0 3px 10px var(--aqua-glow)' }}
                                    >
                                        <i className="fas fa-external-link-alt"></i> Open Phone Approval Page
                                    </button>
                                    <div style={{ fontSize: '0.63em', color: socketConnected ? '#16a34a' : '#e05c7a', fontFamily: 'IBM Plex Mono', display: 'flex', alignItems: 'center', gap: '5px' }}>
                                        <i className={socketConnected ? 'fas fa-circle-check' : 'fas fa-circle-xmark'}></i>
                                        {socketConnected ? 'Gateway Connected — awaiting approval' : 'Server offline — switch to simulator'}
                                    </div>
                                </>
                            )}
                        </div>
                    </div>

                    {/* Bottom action row */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', position: 'relative', zIndex: 20 }}>
                        <button type="button" className="portal-btn portal-btn-secondary" style={{ width: 'auto', padding: '10px 20px', fontSize: '0.82em' }} onClick={onPrev}>
                            <i className="fas fa-arrow-left" style={{ marginRight: '6px' }}></i> Back to Login
                        </button>
                        {isOfflineMode && (
                            <button
                                type="button"
                                onClick={() => { setIsOfflineMode(false); initMfa(); }}
                                style={{ background: 'none', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '8px 14px', fontSize: '0.72em', color: 'var(--aqua-primary)', cursor: 'pointer', fontFamily: 'IBM Plex Mono', display: 'flex', alignItems: 'center', gap: '6px' }}
                            >
                                <i className="fas fa-satellite-dish"></i> Switch to Live QR Mode
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // 3. SELECTION STAGE
        const SelectScreen = ({ onNext, onPrev }) => (
            <div className="portal-card" style={{maxWidth: '480px'}}>
                <div className="card-header">
                    <div className="card-icon"><i className="fas fa-microchip"></i></div>
                    <h2 className="card-title">Smart B.Tech</h2>
                    <p className="card-subtitle">Tap into the information.</p>
                </div>
                <div style={{marginBottom: '24px'}}>
                    <div
                        style={{
                            cursor: 'pointer',
                            padding: '28px 24px',
                            textAlign: 'center',
                            border: '1.5px solid var(--aqua-primary)',
                            borderRadius: '14px',
                            background: 'linear-gradient(135deg,rgba(46,196,182,0.07),rgba(116,199,236,0.07))',
                            transition: 'all 0.25s',
                            boxShadow: '0 4px 16px rgba(46,196,182,0.10)',
                        }}
                        onClick={() => onNext('dashboard')}
                        onMouseEnter={e => { e.currentTarget.style.transform='translateY(-3px)'; e.currentTarget.style.boxShadow='0 10px 28px rgba(46,196,182,0.22)'; }}
                        onMouseLeave={e => { e.currentTarget.style.transform='none'; e.currentTarget.style.boxShadow='0 4px 16px rgba(46,196,182,0.10)'; }}
                    >
                        <div style={{fontSize:'2.6em', color:'var(--aqua-primary)', marginBottom:'12px'}}>
                            <i className="fas fa-microchip"></i>
                        </div>
                        <div style={{fontFamily:'Space Grotesk,sans-serif', fontWeight:700, fontSize:'1.1em', color:'var(--aqua-dark)', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:'8px'}}>
                            Smart B.Tech
                        </div>
                        <p style={{fontSize:'0.82em', color:'var(--text-muted)', margin:0, lineHeight:1.6}}>
                            Syllabus logs, performance graphs, CGPA computation and all academic resources.
                        </p>
                        <div style={{marginTop:'14px', display:'inline-flex', alignItems:'center', gap:'6px', fontSize:'0.75em', color:'var(--aqua-primary)', fontFamily:'IBM Plex Mono,monospace', background:'rgba(46,196,182,0.10)', padding:'5px 14px', borderRadius:'20px', border:'1px solid rgba(46,196,182,0.25)'}}>
                            <i className="fas fa-arrow-right"></i> Enter Portal
                        </div>
                    </div>
                </div>
                <button className="portal-btn portal-btn-secondary" onClick={onPrev}>
                    Back to Gateway
                </button>
            </div>
        );


        // 4. CHAT / MENTOR PILOT SCREEN
        const ChatScreen = ({ onReset }) => (
            <div className="portal-card" style={{maxWidth: '750px', width: '90%'}}>
                <div className="card-header" style={{textAlign: 'left', display: 'flex', justifySelf: 'stretch', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid var(--border-color)', paddingBottom: '16px', marginBottom: '20px'}}>
                    <div style={{display: 'flex', alignItems: 'center', gap: '12px'}}>
                        <div style={{fontSize: '2em', color: 'var(--brass-primary)'}}><i className="fas fa-brain"></i></div>
                        <div>
                            <h2 style={{fontSize: '1.2em'}}>LLM Engineer Pilot</h2>
                            <p style={{fontSize: '0.75em', color: 'var(--text-muted)'}} className="data-text">AI Placement Assistant v1.4.0</p>
                        </div>
                    </div>
                    <button className="portal-btn portal-btn-secondary" style={{width: 'auto', padding: '8px 16px', fontSize: '0.8em'}} onClick={onReset}>
                        <i className="fas fa-sign-out-alt"></i> Leave Workspace
                    </button>
                </div>
                
                <div className="wireframe-container" style={{minHeight: '200px'}}>
                    <div className="data-text" style={{color: 'var(--text-muted)', fontSize: '0.8em'}}>// INTERVIEW PREPARATION SHELL READY</div>
                    <div className="wireframe-block short" style={{backgroundColor: 'var(--border-color)'}}></div>
                    <div className="wireframe-block three-quarters"></div>
                    <div className="wireframe-block"></div>
                </div>
                
                <div style={{display: 'flex', gap: '12px'}}>
                    <div style={{flex: 1, border: '1px solid var(--border-color)', borderRadius: 'var(--border-radius-md)', padding: '12px', background: 'rgba(255,255,255,0.02)'}}>
                        <p style={{color: 'var(--text-muted)', fontSize: '0.9em'}}>Prompt AI tutor...</p>
                    </div>
                    <button className="portal-btn portal-btn-primary" style={{width: 'auto'}}>
                        Send <i className="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        );

        // 5. DASHBOARD SCREEN — Premium 7-Card Shell
        const DashboardScreen = ({ studentId, onReset }) => {
            const cards = [
                {
                    id: 'smart-btech',
                    color: 'c-aqua',
                    icon: 'fa-microchip',
                    title: 'Smart B.Tech',
                    desc: 'Tap into the information.',
                    badge: 'Academic Hub',
                    href: 'finalhindu.html'
                }
            ];

            const now = new Date();
            const hour = now.getHours();
            const greeting = hour < 12 ? '🌅 Good morning' : hour < 17 ? '☀️ Good afternoon' : '🌙 Good evening';

            const handleCardClick = (href) => {
                if (href) window.location.href = href;
            };

            return (
                <div className="ds-shell">
                    {/* Welcome bar */}
                    <div className="ds-welcome-bar">
                        <div>
                            <div className="ds-greeting">{greeting}, {studentId || 'Student'} 🎓</div>
                            <div className="ds-sub">Hindu Engineering College · Student Portal · {now.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
                        </div>
                        <button className="ds-logout-btn" onClick={onReset} id="ds-logout-btn">
                            <i className="fas fa-right-from-bracket"></i> Sign Out
                        </button>
                    </div>

                    {/* Module cards */}
                    <div className="ds-grid" style={{ gridTemplateColumns: '1fr', maxWidth: '520px', margin: '0 auto' }}>
                        {cards.map((card, idx) => (
                            <div
                                key={card.id}
                                id={`ds-card-${card.id}`}
                                className={`ds-card ${card.color}`}
                                style={{ animationDelay: `${idx * 0.06}s` }}
                                onClick={() => handleCardClick(card.href)}
                                role="button"
                                tabIndex={0}
                                onKeyDown={e => e.key === 'Enter' && handleCardClick(card.href)}
                            >
                                <div className="ds-card-glyph">
                                    <i className={`fas ${card.icon}`}></i>
                                </div>
                                <div className="ds-card-title">{card.title}</div>
                                <div className="ds-card-desc">{card.desc}</div>
                                <div className="ds-card-footer">
                                    <span className="ds-card-badge">{card.badge}</span>
                                    <span className="ds-card-arrow"><i className="fas fa-arrow-right"></i></span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- MAIN APP SHELL COMPONENT ---

        function App() {
            // Stage state machine state: 'login' | 'otp' | 'select' | 'chat' | 'dashboard'
            const [stage, setStage] = useState('login');
            const [studentId, setStudentId] = useState('');

            // Handle transition helpers
            const handleNext = (nextStage, data) => {
                if (stage === 'login') {
                    if (nextStage && typeof nextStage === 'string') {
                        // QR login fast-path: skip OTP + select, go straight to dashboard
                        if (nextStage.startsWith('QR_AUTH_')) {
                            setStudentId('QR Student');
                            setStage('dashboard');
                            return;
                        }
                        setStudentId(nextStage);
                    }
                    setStage('otp');
                }
                else if (stage === 'otp') setStage('select');
                else if (stage === 'select') setStage(nextStage || 'dashboard');
            };

        const handleBack = () => {
                if (stage === 'otp') setStage('login');
                else if (stage === 'select') setStage('otp');
            };

            const handleReset = () => {
                setStage('login');
                setStudentId('');
            };

            return (
                <React.Fragment>
                    {/* Header */}
                    <header className="app-header">
                        <div className="logo-section">
                            <i className="fas fa-graduation-cap logo-crest"></i>
                            <div className="logo-text">
                                <h1>Hindu Engineering College</h1>
                                <p className="data-text">Student Portal & AI Tutor</p>
                            </div>
                        </div>
                        <div className="system-status">
                            <span className="status-dot"></span>
                            <span className="data-text" style={{color: 'var(--brass-primary)'}}>{stage.toUpperCase()}</span>
                        </div>
                    </header>

                    {/* Main Render Viewport based on State Machine */}
                    <main className="portal-viewport">
                        {stage === 'login'     && <LoginScreen onNext={(verifiedId) => handleNext(verifiedId)} />}
                        {stage === 'otp'       && <OTPScreen studentId={studentId} onNext={() => handleNext()} onPrev={handleBack} />}
                        {stage === 'select'    && <SelectScreen onNext={(target) => handleNext(target)} onPrev={handleBack} />}
                        {stage === 'chat'      && <ChatScreen onReset={handleReset} />}
                        {stage === 'dashboard' && <DashboardScreen studentId={studentId} onReset={handleReset} />}
                    </main>

                </React.Fragment>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
